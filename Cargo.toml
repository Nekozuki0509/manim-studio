[package]
name = "manim-studio"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "manim-studio"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.27", default-features = true }
egui = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
